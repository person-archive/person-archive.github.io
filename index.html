<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近世近代人名アーカイブス</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Noto Sans JP"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen font-sans">

<div class="max-w-2xl mx-auto px-4 py-12">

  <header class="mb-10 fade-down">
    <h1 class="text-2xl font-bold text-gray-900 tracking-wide">近世近代人名アーカイブス</h1>
  </header>

  <div class="mb-8 fade-down-delay">
    <div class="flex rounded-lg border border-gray-300 bg-white overflow-hidden shadow-sm focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition-all">
      <input type="text" id="queryInput" placeholder="フリーワード検索" autofocus
        class="flex-1 px-4 py-3 outline-none text-base bg-transparent text-gray-900 placeholder-gray-400 font-sans">
      <button id="searchBtn" onclick="doSearch()"
        class="px-6 py-3 bg-blue-600 text-white text-base font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-150 border-0 cursor-pointer font-sans">
        検索
      </button>
    </div>
    <div class="flex items-center gap-2 mt-2">
      <label class="text-sm text-gray-600 flex-shrink-0">役職・肩書</label>
      <input type="text" id="roleInput" placeholder="例：大阪府　士族"
        class="flex-1 px-3 py-2.5 border border-gray-300 rounded-md outline-none text-base bg-white text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-sans">
    </div>
  </div>

  <div id="resultsArea"></div>

  <footer class="mt-16 pt-6 border-t border-gray-200 text-sm text-gray-500">
    <p class="leading-relaxed">
      Copyright © Nagoya University<br>
      Research Group on Japanese Early Modern-Modern Continuity (JEMMCO)
    </p>
    <div class="flex items-center gap-2 mt-3 flex-wrap leading-relaxed">
      <img src="https://licensebuttons.net/l/by/4.0/88x31.png" alt="Creative Commons License" class="flex-shrink-0">
      <span>このデータベースは<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline">クリエイティブ・コモンズ 表示 4.0 ライセンス</a>のもとで利用できます。</span>
    </div>
  </footer>

</div>

<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycbxD4cvf3Ay8RPk0PYJbMRlsHgMtbffXStizkOVVyXr6sQbm27um6DxKSMQwChWo4z8/exec';

const queryInput = document.getElementById('queryInput');
const searchBtn = document.getElementById('searchBtn');
const resultsArea = document.getElementById('resultsArea');

const PAGE_SIZE = 50;
let lastRawJson = '';
let lastResults = [];
let allResults = [];
let currentPage = 1;
let currentDisplayQuery = '';

queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

document.getElementById('roleInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

async function doSearch() {
  const query = queryInput.value.trim();
  const role  = document.getElementById('roleInput').value.trim();

  if (!query && !role) { queryInput.focus(); return; }

  searchBtn.disabled = true;
  resultsArea.innerHTML = '<div class="status"><span class="spinner"></span>検索中…</div>';

  try {
    const params = new URLSearchParams({ max: 99999 });
    if (query) params.set('q', query);
    if (role)  params.set('role', role);
    const url = `${API_BASE}?${params}`;

    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rawText = await res.text();
    lastRawJson = rawText;
    const data = JSON.parse(rawText);

    if (data.error) {
      resultsArea.innerHTML = `<div class="status error">${escapeHtml(data.error)}</div>`;
      return;
    }

    allResults = data.results || [];
    lastResults = allResults;
    currentPage = 1;
    currentDisplayQuery = [query, role].filter(Boolean).join(' ');
    renderPage();
  } catch (err) {
    resultsArea.innerHTML = `<div class="status error">エラーが発生しました: ${escapeHtml(err.message)}</div>`;
  } finally {
    searchBtn.disabled = false;
  }
}

function renderPage() {
  const total = allResults.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageResults = allResults.slice(start, start + PAGE_SIZE);
  renderResults(pageResults, total, totalPages, currentDisplayQuery);
}

function goToPage(page) {
  const totalPages = Math.ceil(allResults.length / PAGE_SIZE);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderPage();
  resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderEntry(entry, keywords) {
  let html = '';

  if (entry.source) {
    html += `<div class="detail-section">`;
    if (Array.isArray(entry.source)) {
      entry.source.forEach(src => { html += renderSourceLink(src, keywords); });
    } else {
      html += renderSourceLink(entry.source, keywords);
    }
    html += `</div>`;
  }

  if (entry.roles && Array.isArray(entry.roles) && entry.roles.length > 0) {
    html += `<div class="detail-section"><div>`;
    entry.roles.forEach(r => {
      const roleText = typeof r === 'string' ? r : (r.role || r.name || r.title || JSON.stringify(r));
      html += `<span class="role-tag">${highlightText(escapeHtml(String(roleText)), keywords)}</span>`;
    });
    html += `</div></div>`;
  }

  if (entry.events && Array.isArray(entry.events) && entry.events.length > 0) {
    html += `<div class="detail-section"><ul>`;
    entry.events.forEach(ev => {
      if (typeof ev === 'string') {
        html += `<li>${highlightText(escapeHtml(ev), keywords)}</li>`;
      } else if (typeof ev === 'object' && ev !== null) {
        const date = ev.date || ev['日付'] || ev.year || '';
        const desc = ev.description || ev.event || ev['内容'] || ev.title || ev.name || '';
        const rest = Object.entries(ev)
          .filter(([k]) => !['date','日付','year','description','event','内容','title','name'].includes(k))
          .map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`)
          .join('　');
        const fullDesc = [desc, rest].filter(Boolean).join('　');
        if (date) {
          html += `<li><div class="event-item">
            <span class="event-date">${highlightText(escapeHtml(String(date)), keywords)}</span>
            <span class="event-desc">${highlightText(escapeHtml(String(fullDesc || '—')), keywords)}</span>
          </div></li>`;
        } else {
          html += `<li>${highlightText(escapeHtml(fullDesc || JSON.stringify(ev)), keywords)}</li>`;
        }
      }
    });
    html += `</ul></div>`;
  }

  const skipKeys = new Set(['name','名前','氏名','id','ID','roles','events','source']);
  const otherEntries = Object.entries(entry).filter(([k]) => !skipKeys.has(k));
  if (otherEntries.length > 0) {
    html += `<div class="detail-section">`;
    otherEntries.forEach(([k, v]) => {
      const val = typeof v === 'object' ? JSON.stringify(v, null, 1) : String(v ?? '');
      if (!val) return;
      html += `<div class="field">
        <span class="field-key">${escapeHtml(k)}</span>
        <span class="field-value">${highlightText(escapeHtml(val), keywords)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function renderResults(results, total, totalPages, query) {
  if (total === 0) {
    resultsArea.innerHTML = `
      <div class="empty-state">
        <div class="icon">◯</div>
        <p>「${escapeHtml(query)}」に一致する結果はありませんでした</p>
      </div>`;
    return;
  }

  const keywords = query.split(/\s+/).filter(k => k.length > 0);
  const pageStart = (currentPage - 1) * PAGE_SIZE;

  let html = `
    <div class="results-header">
      <h2>検索結果</h2>
      <div style="display:flex;align-items:center;gap:12px;">
        <span>「${escapeHtml(query)}」— 全${total}件</span>
        <button class="copy-btn" onclick="copyJson(this)" title="APIレスポンスをコピー">📋 JSON コピー</button>
      </div>
    </div>`;

  results.forEach((group, i) => {
    const globalIndex = pageStart + i;
    const name    = group.canonical_name || '不明';
    const entries = group.entries || [];
    const badge   = entries.length > 1
      ? `<span class="entry-badge">史料 ${entries.length}件</span>`
      : '';

    html += `
      <div class="result-card" style="animation-delay: ${i * 0.04}s" onclick="toggleCard(event, this)">
        <div class="card-summary">
          <div class="card-number">${globalIndex + 1}</div>
          <div class="card-title">${highlightText(escapeHtml(name), keywords)}${badge}</div>
          <span class="chevron">▶</span>
        </div>
        <div class="card-detail" onclick="event.stopPropagation()">`;

    if (entries.length > 1) {
      entries.forEach((entry, ei) => {
        html += `<div class="entry-divider">史料 ${ei + 1}（${escapeHtml(entry.id || '')}）</div>`;
        html += renderEntry(entry, keywords);
      });
    } else if (entries.length === 1) {
      html += renderEntry(entries[0], keywords);
    }

    html += `
          <button class="person-copy-btn" onclick="copyPerson(this, ${globalIndex})" title="この人物の情報をコピー">📋 コピー</button>
        </div>
      </div>`;
  });

  if (totalPages > 1) {
    html += `
      <div class="pagination">
        <button class="pagination-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← 前へ</button>
        <span class="pagination-info">${currentPage} / ${totalPages} ページ（全${total}件）</span>
        <button class="pagination-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>次へ →</button>
      </div>`;
  }

  resultsArea.innerHTML = html;
}

function renderSourceLink(src, keywords) {
  if (typeof src === 'string') {
    if (src.startsWith('http')) {
      return `<a class="source-link" href="${escapeHtml(src)}" target="_blank" rel="noopener">${escapeHtml(src)}</a><br>`;
    }
    return `<span style="font-size:0.85rem">${highlightText(escapeHtml(src), keywords)}</span><br>`;
  }
  if (typeof src === 'object' && src !== null) {
    const url = src.url || src.link || src.href || '';
    const label = src.title || src.name || src.label || url || JSON.stringify(src);
    if (url) {
      return `<a class="source-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">${highlightText(escapeHtml(String(label)), keywords)}</a><br>`;
    }
    return `<span style="font-size:0.85rem">${highlightText(escapeHtml(String(label)), keywords)}</span><br>`;
  }
  return '';
}

function highlightText(text, keywords) {
  let result = text;
  for (const kw of keywords) {
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escaped})`, 'gi');
    result = result.replace(regex, '<mark style="background:#fef08a;color:#1f2937;padding:0 2px;border-radius:2px;">$1</mark>');
  }
  return result;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleCard(event, card) {
  const selection = window.getSelection();
  if (selection && selection.toString().length > 0) return;
  card.classList.toggle('open');
}

function formatEntryText(entry) {
  const lines = [];
  if (entry.roles && Array.isArray(entry.roles) && entry.roles.length > 0) {
    const roleTexts = entry.roles.map(r =>
      typeof r === 'string' ? r : (r.role || r.name || r.title || JSON.stringify(r))
    );
    lines.push(`役職: ${roleTexts.join(', ')}`);
  }
  if (entry.events && Array.isArray(entry.events) && entry.events.length > 0) {
    lines.push('経歴:');
    entry.events.forEach(ev => {
      if (typeof ev === 'string') {
        lines.push(`  ${ev}`);
      } else if (typeof ev === 'object' && ev !== null) {
        const date = ev.date || ev['日付'] || ev.year || '';
        const desc = ev.description || ev.event || ev['内容'] || ev.title || ev.name || '';
        lines.push(`  ${date ? date + ' ' : ''}${desc || JSON.stringify(ev)}`);
      }
    });
  }
  if (entry.source) {
    const sources = Array.isArray(entry.source) ? entry.source : [entry.source];
    lines.push(`出典: ${sources.map(s => typeof s === 'string' ? s : (s.url || s.title || JSON.stringify(s))).join(', ')}`);
  }
  return lines.join('\n');
}

function formatPersonText(group) {
  const lines = [];
  const name = group.canonical_name || '';
  const id   = group.canonical_id   || '';
  if (name) lines.push(`名前: ${name}`);
  if (id)   lines.push(`ID: ${id}`);

  const entries = group.entries || [];
  if (entries.length === 1) {
    lines.push(formatEntryText(entries[0]));
  } else {
    entries.forEach((entry, i) => {
      lines.push(`\n--- 史料 ${i + 1}（${entry.id || ''}）---`);
      lines.push(formatEntryText(entry));
    });
  }

  return lines.join('\n');
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

async function copyPerson(btn, index) {
  const person = lastResults[index];
  if (!person) return;
  await copyToClipboard(formatPersonText(person));
  btn.classList.add('copied');
  btn.textContent = '✓ コピーしました';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.textContent = '📋 コピー';
  }, 2000);
}

async function copyJson(btn) {
  await copyToClipboard(lastRawJson);
  btn.classList.add('copied');
  btn.textContent = '✓ コピーしました';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = '📋 JSON コピー';
  }, 2000);
}
</script>

</body>
</html>

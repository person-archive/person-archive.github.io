<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近世近代人名アーカイブス</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --accent-soft: #e74c3c22;
    --border: #d4cbb8;
    --muted: #8a7f6e;
    --card-bg: #fffdf7;
    --shadow: 0 2px 20px rgba(26, 26, 46, 0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* Subtle texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.02'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: -1;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 60px 0 40px;
    text-align: center;
    animation: fadeDown 0.6s ease-out;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--ink);
    position: relative;
    display: inline-block;
  }

  header h1::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 2px;
    background: var(--accent);
  }

  header p {
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* Search Area */
  .search-area {
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease-out 0.15s both;
  }

  .search-box {
    display: flex;
    gap: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 2px 24px rgba(192, 57, 43, 0.08);
  }

  .search-box input {
    flex: 1;
    padding: 16px 20px;
    border: none;
    outline: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1rem;
    background: transparent;
    color: var(--ink);
  }

  .search-box input::placeholder {
    color: var(--muted);
    font-weight: 300;
  }

  .search-box button {
    padding: 16px 28px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s;
  }

  .search-box button:hover {
    background: var(--accent);
  }

  .search-box button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .search-options {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    padding: 0 4px;
  }

  .search-options label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }

  .search-options select {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.8rem;
    color: var(--ink);
    background: var(--card-bg);
    outline: none;
  }

  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-left: auto;
    font-weight: 300;
  }

  /* Status */
  .status {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 300;
  }

  .status.error {
    color: var(--accent);
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .results-header h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.08em;
  }

  .results-header span {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }

  .result-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeUp 0.4s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .card-summary:hover {
    background: rgba(0,0,0,0.02);
  }

  .result-card .card-number {
    width: 26px;
    height: 26px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .card-summary .card-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    flex: 1;
  }

  .card-summary .chevron {
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.25s;
    flex-shrink: 0;
  }

  .result-card.open .chevron {
    transform: rotate(90deg);
  }

  .card-detail {
    display: none;
    padding: 0 20px 18px 58px;
    border-top: 1px solid var(--border);
  }

  .result-card.open .card-detail {
    display: block;
  }

  /* Detail sections */
  .detail-section {
    margin-top: 14px;
  }

  .detail-section-title {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .detail-section ul {
    list-style: none;
    padding: 0;
  }

  .detail-section li {
    font-size: 0.85rem;
    padding: 4px 0;
    color: var(--ink);
    border-bottom: 1px dotted var(--border);
    line-height: 1.6;
  }

  .detail-section li:last-child {
    border-bottom: none;
  }

  .event-item {
    display: flex;
    gap: 8px;
    align-items: baseline;
  }

  .event-date {
    color: var(--muted);
    font-size: 0.78rem;
    flex-shrink: 0;
    min-width: 90px;
  }

  .event-desc {
    flex: 1;
  }

  .source-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    word-break: break-all;
    transition: opacity 0.2s;
  }

  .source-link:hover {
    opacity: 0.7;
    text-decoration: underline;
  }

  .role-tag {
    display: inline-block;
    padding: 2px 10px;
    margin: 2px 4px 2px 0;
    background: var(--accent-soft);
    border-radius: 3px;
    font-size: 0.82rem;
    color: var(--ink);
  }

  .field {
    display: flex;
    gap: 8px;
    font-size: 0.85rem;
    padding: 4px 0;
  }

  .field-key {
    color: var(--muted);
    font-weight: 400;
    flex-shrink: 0;
    min-width: 60px;
    font-size: 0.78rem;
    padding-top: 1px;
  }

  .field-value {
    color: var(--ink);
    font-weight: 400;
    word-break: break-word;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    animation: fadeUp 0.5s ease-out;
  }

  .empty-state .icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .empty-state p {
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 300;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* Copy button */
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .copy-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .copy-btn.copied {
    border-color: #27ae60;
    color: #27ae60;
  }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 40px 0 30px; }
    header h1 { font-size: 1.6rem; }
    .search-box button { padding: 14px 18px; font-size: 0.85rem; }
    .card-summary { padding: 12px 14px; }
    .card-detail { padding: 0 14px 14px 46px; }
    .search-options { flex-wrap: wrap; }
    .event-item { flex-direction: column; gap: 2px; }
    .event-date { min-width: auto; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>近世近代人名アーカイブス</h1>
    <p>キーワードを入力して検索（スペース区切りでAND検索）</p>
  </header>

  <div class="search-area">
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="" autofocus>
      <button id="searchBtn" onclick="doSearch()">検 索</button>
    </div>
    <div class="search-options">
      <label for="maxSelect">表示件数</label>
      <select id="maxSelect">
        <option value="50">50件</option>
        <option value="100">100件</option>
        <option value="99999" selected>無制限</option>
      </select>
      <span class="hint">Enter で検索</span>
    </div>
  </div>

  <div id="resultsArea"></div>

  <footer>Copyright © Nagoya University All Rights Reserved.<br>
          Research Group on Japanese Early Modern-Modern Continuity (JEMMCO)</footer>
</div>

<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycbxD4cvf3Ay8RPk0PYJbMRlsHgMtbffXStizkOVVyXr6sQbm27um6DxKSMQwChWo4z8/exec';

const queryInput = document.getElementById('queryInput');
const searchBtn = document.getElementById('searchBtn');
const maxSelect = document.getElementById('maxSelect');
const resultsArea = document.getElementById('resultsArea');

let lastRawJson = ''; // store raw API response

// Enter key to search
queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

async function doSearch() {
  const query = queryInput.value.trim();
  if (!query) {
    queryInput.focus();
    return;
  }

  const max = maxSelect.value;
  searchBtn.disabled = true;
  resultsArea.innerHTML = '<div class="status"><span class="spinner"></span>検索中…</div>';

  try {
    const url = `${API_BASE}?q=${encodeURIComponent(query)}&max=${max}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rawText = await res.text();
    lastRawJson = rawText;
    const data = JSON.parse(rawText);

    if (data.error) {
      resultsArea.innerHTML = `<div class="status error">${escapeHtml(data.error)}</div>`;
      return;
    }

    renderResults(data, query);
  } catch (err) {
    resultsArea.innerHTML = `<div class="status error">エラーが発生しました: ${escapeHtml(err.message)}</div>`;
  } finally {
    searchBtn.disabled = false;
  }
}

function renderResults(data, query) {
  const { results, count } = data;

  if (!results || results.length === 0) {
    resultsArea.innerHTML = `
      <div class="empty-state">
        <div class="icon">◯</div>
        <p>「${escapeHtml(query)}」に一致する結果はありませんでした</p>
      </div>`;
    return;
  }

  const keywords = query.split(/\s+/).filter(k => k.length > 0);

  let html = `
    <div class="results-header">
      <h2>検索結果</h2>
      <div style="display:flex;align-items:center;gap:12px;">
        <span>「${escapeHtml(query)}」— ${count}件</span>
        <button class="copy-btn" onclick="copyJson(this)" title="APIレスポンスをコピー">📋 JSON コピー</button>
      </div>
    </div>`;

  results.forEach((person, i) => {
    const name = person.name || person['名前'] || person['氏名'] || '不明';
    const id = person.id || person['ID'] || '';
    const titleText = id ? `${name}（${id}）` : name;

    html += `
      <div class="result-card" style="animation-delay: ${i * 0.04}s" onclick="this.classList.toggle('open')">
        <div class="card-summary">
          <div class="card-number">${i + 1}</div>
          <div class="card-title">${highlightText(escapeHtml(titleText), keywords)}</div>
          <span class="chevron">▶</span>
        </div>
        <div class="card-detail" onclick="event.stopPropagation()">`;

    // Roles
    if (person.roles && Array.isArray(person.roles) && person.roles.length > 0) {
      html += `<div class="detail-section">
        <div class="detail-section-title">Roles</div>
        <div>`;
      person.roles.forEach(r => {
        const roleText = typeof r === 'string' ? r : (r.role || r.name || r.title || JSON.stringify(r));
        html += `<span class="role-tag">${highlightText(escapeHtml(String(roleText)), keywords)}</span>`;
      });
      html += `</div></div>`;
    }

    // Events
    if (person.events && Array.isArray(person.events) && person.events.length > 0) {
      html += `<div class="detail-section">
        <div class="detail-section-title">Events</div>
        <ul>`;
      person.events.forEach(ev => {
        if (typeof ev === 'string') {
          html += `<li>${highlightText(escapeHtml(ev), keywords)}</li>`;
        } else if (typeof ev === 'object' && ev !== null) {
          const date = ev.date || ev['日付'] || ev.year || '';
          const desc = ev.description || ev.event || ev['内容'] || ev.title || ev.name || '';
          const rest = Object.entries(ev)
            .filter(([k]) => !['date','日付','year','description','event','内容','title','name'].includes(k))
            .map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`)
            .join('　');
          const fullDesc = [desc, rest].filter(Boolean).join('　');
          if (date) {
            html += `<li><div class="event-item">
              <span class="event-date">${highlightText(escapeHtml(String(date)), keywords)}</span>
              <span class="event-desc">${highlightText(escapeHtml(String(fullDesc || '—')), keywords)}</span>
            </div></li>`;
          } else {
            html += `<li>${highlightText(escapeHtml(fullDesc || JSON.stringify(ev)), keywords)}</li>`;
          }
        }
      });
      html += `</ul></div>`;
    }

    // Source
    if (person.source) {
      html += `<div class="detail-section">
        <div class="detail-section-title">Source</div>`;
      if (Array.isArray(person.source)) {
        person.source.forEach(src => {
          html += renderSourceLink(src, keywords);
        });
      } else {
        html += renderSourceLink(person.source, keywords);
      }
      html += `</div>`;
    }

    // Other fields (exclude name, id, roles, events, source)
    const skipKeys = new Set(['name','名前','氏名','id','ID','roles','events','source']);
    const otherEntries = Object.entries(person).filter(([k]) => !skipKeys.has(k));
    if (otherEntries.length > 0) {
      html += `<div class="detail-section">
        <div class="detail-section-title">その他</div>`;
      otherEntries.forEach(([k, v]) => {
        const val = typeof v === 'object' ? JSON.stringify(v, null, 1) : String(v ?? '');
        if (!val) return;
        html += `<div class="field">
          <span class="field-key">${escapeHtml(k)}</span>
          <span class="field-value">${highlightText(escapeHtml(val), keywords)}</span>
        </div>`;
      });
      html += `</div>`;
    }

    html += `
        </div>
      </div>`;
  });

  resultsArea.innerHTML = html;
}

function renderSourceLink(src, keywords) {
  if (typeof src === 'string') {
    if (src.startsWith('http')) {
      return `<a class="source-link" href="${escapeHtml(src)}" target="_blank" rel="noopener">${escapeHtml(src)}</a><br>`;
    }
    return `<span style="font-size:0.85rem">${highlightText(escapeHtml(src), keywords)}</span><br>`;
  }
  if (typeof src === 'object' && src !== null) {
    const url = src.url || src.link || src.href || '';
    const label = src.title || src.name || src.label || url || JSON.stringify(src);
    if (url) {
      return `<a class="source-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">${highlightText(escapeHtml(String(label)), keywords)}</a><br>`;
    }
    return `<span style="font-size:0.85rem">${highlightText(escapeHtml(String(label)), keywords)}</span><br>`;
  }
  return '';
}

// Heuristic: find a key that looks like a name
function findNameKey(obj) {
  const namePatterns = ['名前', '氏名', 'name', 'Name', '人名', '名称', '姓名', 'フルネーム'];
  for (const p of namePatterns) {
    if (obj[p] !== undefined) return p;
  }
  for (const [k, v] of Object.entries(obj)) {
    if (typeof v === 'string' && v.length > 0 && v.length < 40) return k;
  }
  return null;
}

function highlightText(text, keywords) {
  let result = text;
  for (const kw of keywords) {
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escaped})`, 'gi');
    result = result.replace(regex, '<mark style="background:#f6d365;color:#1a1a2e;padding:0 2px;border-radius:2px;">$1</mark>');
  }
  return result;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function copyJson(btn) {
  try {
    await navigator.clipboard.writeText(lastRawJson);
    btn.classList.add('copied');
    btn.textContent = '✓ コピーしました';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 JSON コピー';
    }, 2000);
  } catch {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = lastRawJson;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.textContent = '✓ コピーしました';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 JSON コピー';
    }, 2000);
  }
}
</script>

</body>
</html>
